name: collect

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Roblox stats
        run: python collector/collect.py
      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data media
          git diff --cached --quiet && exit 0
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
